
<h1>Lista dipendenti</h1>

<button   *ngIf="buttonAggiungi" class="addDipend" mat-raised-button color="primary" (click)="apriDialogAggiungi()">
  Aggiungi Dipendente
</button>


<div class="tabble">     
<table mat-table [dataSource]="dipendenti()" class="mat-elevation-z8 demo-table">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let element">{{element.nome}}</td>
  </ng-container>

  <ng-container matColumnDef="cognome">
    <th mat-header-cell *matHeaderCellDef>Cognome</th>
    <td mat-cell *matCellDef="let element">{{element.cognome}}</td>
  </ng-container>

  <ng-container matColumnDef="dataAssunzione">
    <th mat-header-cell *matHeaderCellDef>Data Assunzione</th>
    <td mat-cell *matCellDef="let element">{{element.dataAssunzione | date:'dd/MM/yyyy'}}</td>
  </ng-container>

  <ng-container matColumnDef="dataDimissione">
    <th mat-header-cell *matHeaderCellDef>Data Dimissioni</th>
    <td mat-cell *matCellDef="let element">{{element.dataDimissione | date:'dd/MM/yyyy'}}</td>
  </ng-container>

  <ng-container matColumnDef="eta">
    <th mat-header-cell *matHeaderCellDef>Età</th>
    <td mat-cell *matCellDef="let element">{{element.eta}}</td>
  </ng-container>

  <ng-container matColumnDef="stipendio">
    <th mat-header-cell *matHeaderCellDef>Stipendio</th>
    <td mat-cell *matCellDef="let element">{{element.stipendio}}</td>
  </ng-container>

  <ng-container matColumnDef="mansione">
    <th mat-header-cell *matHeaderCellDef>Mansione</th>
    <td mat-cell *matCellDef="let element">{{element.tipologiaLavoro?.descrizione}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      (click)="onRowClick(row)"
      class="clickable-row"></tr>
</table>
</div>
