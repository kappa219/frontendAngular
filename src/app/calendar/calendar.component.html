<div class="calendar">
  <!-- Header -->
  <div class="header">
    <button (click)="prevMonth()">←</button>
    <span *ngIf="view === 'month'">{{ currentMonth }} {{ currentYear }}</span>
    <span *ngIf="view === 'week'">{{ getWeekRange() }}</span>
    <button (click)="nextMonth()">→</button>
  </div>

  <!-- Toggle vista -->
  <div class="view-toggle">
    <button [class.active]="view === 'week'" (click)="setView('week')">Settimana</button>
    <button [class.active]="view === 'month'" (click)="setView('month')">Mese</button>
  </div>

  <!-- Vista Mensile -->
  <div *ngIf="view === 'month'" class="month-view">
    <div class="days-header">
      <span *ngFor="let day of ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']">{{day}}</span>
    </div>
    <div class="days-grid">
      <div *ngFor="let day of daysInMonth"
           (click)="selectDay(day)"
           [class.selected]="day === selectedDay">
        {{ day }}
      </div>
    </div>
  </div>

  <!-- Vista Settimanale -->
  <div *ngIf="view === 'week'" class="week-view">
    <div class="week-header">
      <div class="time-column-header"></div>
      <div *ngFor="let day of weekDays"
           class="day-column-header"
           [class.today]="isToday(day)">
        <span class="day-name">{{ getDayName(day) }}</span>
        <span class="day-number">{{ day.getDate() }}</span>
      </div>
    </div>
    <div class="week-body">
      <div *ngFor="let hour of hours" class="time-row">
        <div class="time-label">{{ formatHour(hour) }}</div>

        <div *ngFor="let day of weekDays"
             class="time-cell"
             [class.today]="isToday(day)"
             [class.work-hour]="isWorkHour(day,hour)"
             [class.event-start]="getEventPosition(day,hour) === 'start'"
             [class.event-middle]="getEventPosition(day,hour) === 'middle'"
             [class.event-end]="getEventPosition(day,hour) === 'end'"
             [class.event-single]="getEventPosition(day,hour) === 'single'"
             (click)="onCellClick(day,hour)">
          <span *ngIf="getEvent(day, hour)" class="event-title">{{ getEvent(day, hour) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
